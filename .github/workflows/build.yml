name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Flet
        run: pip install flet requests
      - name: Build APK
        run: flet build apk --project "NetGuard" --org "com.netguard.toolkit"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetGuard-APK
          path: build/apk/*.apk
          
